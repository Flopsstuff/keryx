[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keryx-bridge"
version = "0.1.0"
description = "Voice bridge between the Keryx board (ESP32-S3 + reSpeaker Flex) and the Hermes agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "numpy>=1.26", "pyserial>=3.5"]

[project.scripts]
keryx-bridge = "keryx_bridge.cli:main"

[tool.setuptools]
packages = ["keryx_bridge"]

[tool.setuptools.package-data]
keryx_bridge = ["prompts/*.md"]
